dataset:
  train:
    type: MFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: mfqev2_train_gt.lmdb
    lq_path: mfqev2_train_lq.lmdb
    meta_info_fp: meta_info.txt
    qp: 37
    exclude_video_ids: ['007', '010', '013', '020', '042', '047', '051', '069', '084', '106']
    gt_size: 128
    use_flip: true
    use_rot: true
    random_reverse: true
    enlarge_ratio: 1
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4

  val:
    type: VideoTestMFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: train_108/raw
    lq_path: train_108/HM16.5_LDP/QP37
    qp: 37
    include_video_ids: ['007', '010', '013', '020', '042', '047', '051', '069', '084', '106']

  test:
    type: VideoTestMFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: test_18/raw
    lq_path: test_18/HM16.5_LDP/QP37
    qp: 37

network:
  radius: 3

  stdf:
    in_nc: 1
    out_nc: 64
    nf: 32
    nb: 3
    base_ks: 3
    deform_ks: 3

  qenet:
    in_nc: 64
    out_nc: 1
    nf: 48
    nb: 8
    base_ks: 3

  # This block is deliberately independent of guidance, masks, teachers,
  # hand-crafted high-frequency carriers, and regional write-back.
  stdf_diffusion_baseline:
    temporal_frames: 7
    use_temporal_lq: true
    use_aligned_features: false
    aligned_feature_channels: 64
    aligned_projection_channels: 8
    nf: 48
    cond_dim: 128
    rate_dim: 1
    # ResShift conference setting: a short 15-step chain, p=0.3.
    num_steps: 15
    sample_steps: 4
    shift_power: 0.3
    kappa: 1.0
    eta_end: 0.999
    # Diffusion operates on the normalized post-STDF correction.
    residual_scale: 0.05
    latent_clip: 3.0
    loss_eps: 0.001

train:
  exp_name: MFQEv2_QP37_STDF_matched_baseline
  random_seed: 7
  num_iter: 10000
  interval_print: 100
  interval_val: 2500
  grad_clip: 5.0

  optim:
    type: Adam
    lr: 0.0001
    betas: [0.9, 0.999]
    eps: 0.00000001

  # These weights are identical for the deterministic and diffusion runs.
  baseline_loss:
    latent_weight: 1.0
    image_weight: 1.0
    highfreq_weight: 0.1
    gradient_weight: 0.05
    highfreq_kernel: 5

test:
  sample_steps: 4
  seeds: [7, 17, 29]
