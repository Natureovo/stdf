dataset:
  train:
    type: MFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: mfqev2_train_gt.lmdb
    lq_path: mfqev2_train_lq.lmdb
    meta_info_fp: meta_info.txt
    qp: 37
    # Deterministic video-level validation split, sampled with seed 7.
    exclude_video_ids: ['007', '010', '013', '020', '042', '047', '051', '069', '084', '106']
    gt_size: 128
    use_flip: true
    use_rot: true
    random_reverse: true
    enlarge_ratio: 1
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

  val:
    type: VideoTestMFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: train_108/raw
    lq_path: train_108/HM16.5_LDP/QP37
    qp: 37
    include_video_ids: ['007', '010', '013', '020', '042', '047', '051', '069', '084', '106']

  test:
    type: VideoTestMFQEv2Dataset
    root: /media/cp/SWH-4T机械红/MFQEv2_dataset
    gt_path: test_18/raw
    lq_path: test_18/HM16.5_LDP/QP37
    qp: 37

network:
  radius: 3

  stdf:
    in_nc: 1
    out_nc: 64
    nf: 32
    nb: 3
    base_ks: 3
    deform_ks: 3

  qenet:
    in_nc: 64
    out_nc: 1
    nf: 48
    nb: 8
    base_ks: 3

  diffusion:
    enabled: false
    type: GRDR
    freeze_stdf: true
    # Diffuse a one-channel local gain around a frozen signed temporal prior.
    in_nc: 1
    nf: 48
    cond_dim: 128
    rate_dim: 1
    control_enabled: true
    control_use_rate: true
    control_main_input: full
    control_hf_kernel: 5
    # 64 aligned STDF features plus the signed temporal-prior correction.
    temporal_condition_nc: 65
    num_steps: 1000
    # Terminal supervision supports a direct one-step deterministic predictor;
    # multi-step sampling remains an ablation instead of the default.
    sample_steps: 1
    diagnostic_sample_steps: 1
    # Zero diffusion signal preserves the deterministic temporal prior.
    process_mode: residual_shift
    residual_shift_eta_max: 0.999
    residual_shift_schedule_power: 0.5
    residual_shift_noise_scale: 0.10
    residual_shift_terminal_weight: 1.0
    loss_type: l1
    loss_bg_weight: 1.0
    rec_weight: 1.0
    target_mode: temporal_prior_gain
    target_highfreq_kernel: 5
    prior_gain_window: 9
    prior_gain_max: 2.0
    prior_gain_eps: !!float 1e-12
    wavelet_coefficient_clip: 0.05
    wavelet_condition_scale: 0.10
    wavelet_condition_include_lowpass: true
    carrier_source: base
    carrier_gain_clip: 0.08
    carrier_norm_clip: 3.0
    carrier_eps: !!float 1e-4
    carrier_amp_normalize: true
    # Stage 1 isolates gain learnability before local predicted guidance.
    detail_gate_mode: none
    detail_gate_temperature: 8.0
    detail_gate_hf_weight: 1.0
    detail_gate_diff_weight: 0.5
    detail_gate_guidance_weight: 0.5
    detail_gate_qp_weight: 0.25
    detail_gate_min: 0.0
    train_guidance_threshold: 0.3
    train_residual_scale: 1.0
    train_residual_clip: 0.05
    residual_weight: 1.0
    residual_bg_weight: 0.0
    residual_sign_weight: 0.0
    highfreq_magnitude_weight: 0.5
    highfreq_under_weight: 0.0
    highfreq_under_ratio: 0.9
    degrade_weight: 0.1
    amplitude_over_weight: 0.0
    amplitude_mean_weight: 0.0
    amplitude_sparsity_weight: 0.0
    amplitude_sparsity_gamma: 2.0
    amplitude_focal_weight: 0.0
    amplitude_focal_beta: 4.0
    amplitude_focal_gamma: 2.0
    amplitude_cosine_weight: 0.0
    amplitude_correlation_weight: 0.0
    train_use_hard_mask: false

  guidance_net:
    enabled: true
    in_nc: 1
    nf: 32
    rate_dim: 1
    feature_normalization: raw
    target_threshold: 0.20
    log_thresholds: [0.15, 0.20, 0.25, 0.30]
    log_top_ratios: [0.05, 0.10, 0.20]
    l1_weight: 1.0
    weighted_l1_weight: 1.0
    weighted_l1_beta: 8.0
    weighted_l1_gamma: 2.0
    bce_weight: 0.0
    dice_weight: 0.0
    soft_iou_weight: 0.0
    spatial_correlation_weight: 0.5
    ranking_weight: 0.5
    ranking_pairs: 2048
    ranking_margin: 0.05
    ranking_min_target_gap: 0.05
    std_weight: 0.25
    tv_weight: 0.0005

  utility_mask:
    enabled: true
    nf: 32
    block_size: 16
    use_artifact_features: true
    input_mode: post_correction
    positive_only: true
    uncertainty_sigma: 1.0
    target_clip: 5.0
    regression_weight: 1.0
    positive_weight: 1.0
    ranking_weight: 1.0
    correlation_weight: 0.25
    topk_weight: 1.0
    topk_ratios: [0.05, 0.10, 0.20]
    ranking_pairs: 256
    ranking_margin: 0.05
    ranking_min_target_gap: 0.05
    log_top_ratios: [0.05, 0.10, 0.20]

  budget_net:
    enabled: true
    in_dim: 18
    hidden_dim: 64
    min_budget: 0.02
    max_budget: 0.45
    target_threshold: 0.20
    target_mode: mean_guidance
    l1_weight: 1.0
    mse_weight: 0.25

  direct_residual:
    enabled: true
    in_nc: 1
    nf: 32
    rate_dim: 1
    output_mode: sign_magnitude
    residual_clip: 0.1

  detail_refine:
    enabled: true
    in_nc: 1
    nf: 32
    rate_dim: 1

  # Frozen signed direction carrier. The checkpoint is supplied explicitly to
  # train_hybrid_grdr.py and val_grdr.py.
  temporal_detail_prior:
    enabled: true
    in_nc: 1
    input_frames: 7
    nf: 24
    rate_dim: 1
    use_guidance_input: true
    # Inject the frozen 64-channel deformable STDF fusion feature at all
    # three prior scales.
    use_aligned_features: true
    aligned_feature_channels: 64
    use_global_modulation: true
    prediction_mode: carrier_amplitude
    amplitude_prediction_scale: 1
    carrier_source: base
    carrier_kernel: 5
    carrier_norm_window: 9
    carrier_norm_clip: 3.0
    target_window: 9
    amplitude_clip: 0.05
    wavelet_coefficient_clip: 0.05
    correction_clip: 0.05
    ridge_eps: !!float 1e-3
    target_safe_scale: true
    supervision_mode: analytic
    apply_guidance_gate: false
    guidance_floor: 0.0
    correction_scale: 1.0
    amplitude_weight: 1.0
    correction_weight: 2.0
    reconstruction_weight: 1.0
    highfreq_weight: 0.5
    gradient_weight: 0.1
    degrade_weight: 0.0
    # Used only by the retained target-free pixel-residual ablation.
    relative_reconstruction_weight: 1.0
    relative_highfreq_weight: 0.1
    relative_eps: !!float 1e-6
    tv_weight: 0.001

  # Stage-1 learnability gate. This U-Net keeps the frozen temporal prior as
  # its exact zero-output anchor and learns only a bounded gain residual.
  prior_modulator:
    enabled: true
    in_nc: 1
    input_frames: 7
    nf: 24
    rate_dim: 1
    use_aligned_features: true
    aligned_feature_channels: 64
    # Crop-trained global pooling previously caused full-frame domain shift.
    use_global_modulation: false
    prior_condition_clip: 0.05
    max_delta_gain: 0.5
    carrier_source: base
    carrier_kernel: 5
    carrier_norm_window: 9
    carrier_norm_clip: 3.0
    ridge_eps: !!float 1e-3
    relative_reconstruction_weight: 1.0
    reconstruction_weight: 0.1
    relative_highfreq_weight: 0.1
    gradient_weight: 0.02
    non_degrade_weight: 0.25
    tv_weight: 0.001
    magnitude_weight: 0.0001
    relative_eps: !!float 1e-6

  detail_guidance:
    gradient_weight: 0.35
    highfreq_weight: 0.40
    direction_weight: 0.15
    variance_weight: 0.10
    normalization_mode: local_ratio
    # One 8-bit code value in normalized [0, 1] intensity space.
    gradient_eps: 0.0039215686
    highfreq_eps: 0.0039215686
    direction_eps: 0.0039215686
    variance_eps: 0.0000153787

train:
  exp_name: MFQEv2_QP37_prior_gain
  random_seed: 7
  pre-val: false
  num_iter: 20000
  interval_print: 100
  interval_val: 2000
  pbar_len: 100

  optim:
    type: Adam
    lr: !!float 1e-4
    betas: [0.9, 0.999]
    eps: !!float 1e-8

  scheduler:
    is_on: false
    type: CosineAnnealingRestartLR
    periods: [!!float 2e4]
    restart_weights: [1]
    eta_min: !!float 1e-7

  loss:
    type: CharbonnierLoss
    eps: !!float 1e-6

  criterion:
    type: PSNR
    unit: dB

test:
  restore_iter: 0
  pbar_len: 100
  criterion:
    type: PSNR
    unit: dB
